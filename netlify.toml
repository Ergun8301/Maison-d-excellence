# Configuration de construction pour Netlify.
#
# Sans ce fichier, Netlify tenterait de deviner : il reconnaîtrait Next.js et
# activerait son moteur de rendu serveur, alors que le site est exporté en
# pages statiques. On lui dit donc explicitement quoi lancer et quoi publier.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Formulaires
#
# Les deux formulaires du site sont déclarés en HTML : ils portent un nom, la
# méthode POST, l'attribut data-netlify et des champs nommés. Netlify les repère
# en analysant les pages produites — mais uniquement pendant la construction, et
# à condition que la détection des formulaires soit déjà active sur le projet
# (Project configuration > Forms). L'activer après coup ne suffit pas : il faut
# reconstruire pour que l'analyse ait lieu.

# Les fichiers portant une empreinte dans leur nom ne changent jamais : on les
# fait garder un an par les navigateurs. Les pages HTML, elles, doivent être
# revérifiées à chaque visite, sinon une correction mettrait des jours à
# apparaître chez un visiteur déjà venu.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
